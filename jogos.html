*{box-sizing:border-box;margin:0;padding:0}
:root{--cenario:#00ac00;--nome:#00ee00;--brilho:126,255,92;--h-cenario:clamp(130px,21vw,260px)}
body{background:#000;color:#fff;font-family:"Segoe UI",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;isolation:isolate}
.fundo{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.pixel{position:absolute;bottom:-30px;left:var(--x);width:var(--s);height:var(--s);border:1px solid var(--cenario);box-shadow:0 0 8px rgba(0,172,0,.45);animation:subir var(--d) linear infinite;animation-delay:var(--a);opacity:0}
@keyframes subir{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.5}85%{opacity:.3}100%{transform:translateY(calc(-100vh - 60px)) rotate(180deg);opacity:0}}
.conteudo{flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(28px,6vw,72px) 20px}
.card{max-width:720px;width:100%;padding:clamp(22px,4vw,36px) clamp(18px,4vw,36px);background:#000;border-radius:10px;text-align:center;box-shadow:0 0 0 1px rgba(var(--brilho),.10),0 0 22px rgba(var(--brilho),.16)}
h1{font-size:clamp(1.6rem,4vw,2rem);color:var(--nome);text-shadow:0 0 10px rgba(var(--brilho),.22);line-height:1.3;margin-bottom:16px;overflow-wrap:break-word}
h1 .saudacao{color:#fff}h2{font-size:1.25rem;color:#fff;margin:28px 0 12px}p{line-height:1.7;margin-bottom:12px;color:#fff}.destaque{color:#fff;font-weight:bold}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:22px}
.botao{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:150px;padding:13px 26px;border-radius:8px;color:#fff;text-decoration:none;font-weight:bold;font-size:1.05rem;letter-spacing:.2px;border:2px solid transparent;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s}
.botao .icone{flex:none}.vb{vector-effect:non-scaling-stroke}
.botao.xbox{background:#107c10;border-color:#2fa82f;box-shadow:0 2px 10px rgba(16,124,16,.45)}
.botao.xbox:hover,.botao.xbox:focus-visible{background:#159315;border-color:#5bd35b;box-shadow:0 4px 16px rgba(16,124,16,.7);transform:translateY(-2px)}
.botao.steam{background:linear-gradient(180deg,#2a475e 0%,#171a21 100%);border-color:#66c0f4;box-shadow:0 2px 10px rgba(102,192,244,.25)}
.botao.steam:hover,.botao.steam:focus-visible{background:linear-gradient(180deg,#37607f 0%,#1b2838 100%);border-color:#a3dcff;box-shadow:0 4px 16px rgba(102,192,244,.5);transform:translateY(-2px)}
.botao:focus-visible{outline:2px solid #fff;outline-offset:5px}
footer{margin-top:32px;font-size:.85rem;line-height:1.6;color:#fff;text-align:center}
.cenario{position:relative;width:100%;height:var(--h-cenario);overflow:hidden;pointer-events:none;flex:none}
.cenario svg{position:absolute;top:0;left:50%;height:var(--h-cenario);width:calc(var(--h-cenario)*4.6154);transform:translateX(-50%);overflow:visible;display:block;animation:brilho 5s ease-in-out infinite}
.linha{fill:none;stroke:var(--cenario);stroke-width:2;vector-effect:non-scaling-stroke}.solido{fill:#000;stroke:var(--cenario);stroke-width:2;vector-effect:non-scaling-stroke}
.nuvem{animation:flutuar 7s ease-in-out infinite}.segunda{animation-delay:-3.5s}
@keyframes flutuar{50%{transform:translateY(-7px)}}@keyframes brilho{0%,100%{opacity:.75}50%{opacity:1}}
@media(max-width:480px){.conteudo{padding:24px 14px}.card{padding:22px 14px}.botao{flex:1 1 140px}}
@media(prefers-reduced-motion:reduce){.pixel{display:none}.nuvem,.cenario svg{animation:none}.botao{transition:none}.botao:hover,.botao:focus-visible{transform:none}}
.card{max-width:1050px}button.botao{font-family:inherit;cursor:pointer}button[aria-pressed=true]{border-color:#fff}#tela{height:clamp(300px,65vw,700px);margin-top:24px;border:1px solid #00ac00;border-radius:8px;overflow:hidden}#emulador{height:100%;width:100%;border:0;background:#000}
/* Versão 1.1: cartões com capas, sem alterar os botões da navegação. */
#lista-jogos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px;align-items:stretch}
#lista-jogos .jogo-card{display:flex;flex-direction:column;justify-content:flex-start;gap:0;min-width:0;width:100%;padding:0;overflow:hidden;background:#081108;border-color:#205b20;text-align:center}
#lista-jogos .jogo-card:hover,#lista-jogos .jogo-card:focus-visible{background:#102510;border-color:#5bd35b}
#lista-jogos .jogo-card[aria-pressed=true]{border-color:#fff;box-shadow:0 0 18px rgba(0,238,0,.35)}
.jogo-capa{position:relative;display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1.38;background:radial-gradient(ellipse at center,#173317,#050805);overflow:hidden;border-bottom:1px solid #205b20}
.jogo-capa img{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:contain;padding:8px}
.jogo-capa img[hidden]{display:none}
.capa-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#b1d9b1;font-size:.8rem;font-weight:400}
.capa-fallback .controle{font-size:2.5rem}.capa-fallback[hidden]{display:none}
.jogo-nome{display:flex;align-items:center;justify-content:center;flex:1;width:100%;padding:13px 12px 7px;line-height:1.4;font-size:.95rem;overflow-wrap:anywhere}
.jogo-acao{display:block;padding:0 12px 13px;color:#93e993;font-size:.72rem;font-weight:600;letter-spacing:.9px;text-transform:uppercase}
@media(max-width:480px){#lista-jogos{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}#lista-jogos .jogo-card{flex:none}.jogo-nome{font-size:.8rem;padding:10px 7px 6px}.jogo-capa img{padding:5px}.jogo-acao{font-size:.65rem}}
@media(max-width:320px){#lista-jogos{grid-template-columns:1fr}}

<script>
// Capas: Libretro; segunda tentativa pelo repositório GitHub.
document.querySelectorAll('.jogo-capa img').forEach(img=>{
 const fallback=img.parentElement.querySelector('.capa-fallback');
 const loaded=()=>{img.hidden=false;fallback.hidden=true;};
 const failed=()=>{
  if(!img.dataset.tentouReserva){img.dataset.tentouReserva='true';img.src=img.dataset.reserva;return;}
  img.hidden=true;fallback.hidden=false;
  fallback.querySelector('.capa-mensagem').textContent='Capa indisponível';
 };
 img.addEventListener('load',loaded);
 img.addEventListener('error',failed);
 if(img.complete){if(img.naturalWidth>0)loaded();else failed();}
});
let requestId=0;
const statusText=document.getElementById('status');
document.querySelectorAll('[data-rom]').forEach(button=>{
 button.setAttribute('aria-pressed','false');
 button.addEventListener('click',async()=>{
  const id=++requestId;
  const name=button.dataset.name;
  const url=new URL(button.dataset.rom,document.baseURI).href;
  statusText.textContent='Carregando '+name+'…';
  try{
   const r=await fetch(url,{method:'HEAD'});
   if(id!==requestId)return;
   if(!r.ok||(r.headers.get('content-type')||'').includes('text/html'))throw new Error('ROM não encontrada: '+button.dataset.rom);
   document.querySelectorAll('[data-rom]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
   document.getElementById('tela').hidden=false;
   const options=JSON.stringify({name,url}).replace(/</g,'\u003c');
   const code='const config='+options+';window.EJS_player="#game";window.EJS_core="snes";window.EJS_gameName=config.name;window.EJS_gameUrl=config.url;window.EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";window.EJS_startOnLoaded=true;window.EJS_color="#00ac00";const loader=document.createElement("script");loader.src=window.EJS_pathtodata+"loader.js";loader.onerror=()=>{document.getElementById("game").textContent="Falha ao carregar emulador. Verifique a conexão.";};document.body.appendChild(loader);';
   document.getElementById('emulador').srcdoc='<!doctype html><html><head><meta charset="utf-8"><style>html,body,#game{width:100%;height:100%;margin:0;background:#000;color:#fff;overflow:hidden}</style></head><body><div id="game"></div><script>'+code+'<'+ '/script></body></html>';
   statusText.textContent=name+' — aguarde o carregamento do emulador. Para trocar, clique em outro jogo.';
  }catch(error){if(id===requestId)statusText.textContent=error.message;}
 });
});
</script></body></html>
