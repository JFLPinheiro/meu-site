<script>
"use strict";
// webЯcade v02: mantém o lançamento standalone da v01, sem os painéis removidos.
function standalone(card){
 const props={type:'retro-snes9x',title:card.dataset.name,
  app:'Super Nintendo Entertainment System',
  icon:new URL(card.querySelector('img').getAttribute('src'),document.baseURI).href,
  rom:new URL(card.dataset.rom,document.baseURI).href};
 const encoded=btoa(encodeURIComponent(JSON.stringify(props)));
 return 'https://play.webrcade.com/app/standalone/?app=app/retro-snes9x/&props='+encodeURIComponent(encoded)+'&ctx=standalone';
}
const cards=Array.from(document.querySelectorAll('[data-jogo]'));
if(['https:','http:'].includes(location.protocol)){
 cards.forEach(card=>{card.href=standalone(card);});
 const selecionado=new URLSearchParams(location.search).get('jogo');
 if(selecionado){const card=cards.find(c=>c.dataset.jogo===selecionado);if(card)location.replace(card.href);}
}

</script>
